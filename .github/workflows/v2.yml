name: PickALicense v2

on:
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"
  push:
    branches:
      - master
      - "codex/**"
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
